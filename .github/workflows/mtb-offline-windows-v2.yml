name: Build MTB ALCO Offline Windows v2

on:
  push:
    branches: [main]
    paths:
      - 'offline-v2/**'
      - '.github/workflows/mtb-offline-windows-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore offline app source and original PowerPoint templates
        shell: bash
        run: |
          python - <<'PY'
          import base64,io,tarfile,re
          from pathlib import Path
          root=Path('offline-v2/app')
          root.mkdir(parents=True,exist_ok=True)
          data=base64.b64decode(Path('offline-v2/source_archive.b64').read_text(encoding='ascii'))
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:xz') as archive:
              for member in archive.getmembers():
                  if member.isdir():continue
                  if member.name.startswith('/') or '..' in Path(member.name).parts:raise RuntimeError('Invalid archive path')
                  output=root/member.name;output.parent.mkdir(parents=True,exist_ok=True)
                  with archive.extractfile(member) as src,open(output,'wb') as dst:dst.write(src.read())
          for label,name in [('FDR','MTB_FDR_original.pptx'),('DPS','MTB_DPS_original.pptx')]:
              data=(Path('api/templates')/(label.lower()+'.js')).read_text(encoding='utf-8')
              match=re.search(r'export const '+label+r'_TEMPLATE\s*=\s*"([^"]+)"',data)
              if not match:raise RuntimeError('Original '+label+' PowerPoint not found')
              path=root/'templates'/name;path.parent.mkdir(parents=True,exist_ok=True)
              path.write_bytes(base64.b64decode(match.group(1)))
              print(label,'original template:',path.stat().st_size,'bytes')
          PY
      - name: Install Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r offline-v2/app/requirements.txt pyinstaller
      - name: Test PDF extraction and original PowerPoint preservation
        shell: pwsh
        run: python offline-v2/app/self_test.py
      - name: Build portable Windows application
        shell: pwsh
        working-directory: offline-v2/app
        run: |
          python -m PyInstaller --clean --noconfirm --windowed --onedir --name MTB_ALCO_Tool --add-data "templates;templates" --collect-all fitz --collect-all pymupdf --collect-all reportlab app.py
          Copy-Item README_START_HERE.txt dist/MTB_ALCO_Tool/README_START_HERE.txt
          Copy-Item VERSION.txt dist/MTB_ALCO_Tool/VERSION.txt
      - name: Create public portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path offline-v2/app/dist/MTB_ALCO_Tool -DestinationPath MTB_ALCO_Offline_Windows_v2.zip -CompressionLevel Optimal
          Write-Output "ZIP size $((Get-Item MTB_ALCO_Offline_Windows_v2.zip).Length) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: MTB_ALCO_Offline_Windows_v2
          path: MTB_ALCO_Offline_Windows_v2.zip
          if-no-files-found: error
      - name: Publish Windows app as a public GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view offline-v2.0.0 *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload offline-v2.0.0 MTB_ALCO_Offline_Windows_v2.zip --clobber
          } else {
            gh release create offline-v2.0.0 MTB_ALCO_Offline_Windows_v2.zip --title "MTB ALCO Offline Tool v2.0 – PDF Extraction Fixed" --notes "Offline Windows desktop app. Verified extraction of rates from selectable-text PDFs, including percentages without percent signs, multiple tenors, and table matrices. Original 11-slide FDR and 7-slide DPS templates preserved. Upload PDF beside each bank; always-visible Generate button; View PDF Text and zero-match warnings. No website or account needed."
          }
